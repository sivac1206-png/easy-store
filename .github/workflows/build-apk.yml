name: Build Easy Store APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Install dependencies
        working-directory: easy_store
        run: flutter pub get

      - name: Build APK
        working-directory: easy_store
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Store-APK
          path: easy_store/build/app/outputs/flutter-apk/app-release.apk
