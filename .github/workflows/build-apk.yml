namename: Build Easy Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf easy_store
          mkdir easy_store
          unzip -o easy_store_flutter_source.zip -d easy_store

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create Android project
        working-directory: easy_store
        run: flutter create .

      - name: Get dependencies
        working-directory: easy_store
        run: flutter pub get

      - name: Build APK
        working-directory: easy_store
        run: flutter build apk --release

      - name: Find APK
        run: |
          echo "APK files:"
          find easy_store/build -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Store-APK
          path: easy_store/build/**/*.apk
          if-no-files-found: error
