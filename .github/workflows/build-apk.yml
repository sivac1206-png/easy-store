name: Build Easy Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Easy Store source
        run: |
          unzip -o easy_store_flutter_source.zip -d easy_store
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create Flutter platform files
        working-directory: easy_store
        run: flutter create .

      - name: Install dependencies
        working-directory: easy_store
        run: flutter pub get

      - name: Build APK
        working-directory: easy_store
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Store-APK
          path: easy_store/build/app/outputs/flutter
