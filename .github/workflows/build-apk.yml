name: Build Easy Store APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Extract source
        run: |
          unzip -q easy_store_flutter_source.zip -d source

      - name: Find source
        run: |
          echo "Source files:"
          find source -maxdepth 3 -type f | head -100

      - name: Create fresh Flutter project
        run: |
          flutter create easy_store_app

      - name: Copy Easy Store source
        run: |
          SRC=$(dirname "$(find source -name pubspec.yaml -print -quit)")
          echo "Source directory: $SRC"

          rm -rf easy_store_app/lib
          cp -r "$SRC/lib" easy_store_app/lib

          if [ -d "$SRC/assets" ]; then
            cp -r "$SRC/assets" easy_store_app/assets
          fi

          cp "$SRC/pubspec.yaml" easy_store_app/pubspec.yaml

      - name: Get dependencies
        working-directory: easy_store_app
        run: flutter pub get

      - name: Build APK
        working-directory: easy_store_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Store-APK
          path: easy_store_app/build/app/outputs/flutter-apk/app-release.apk
