name: Build Easy Store APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Extract Flutter source
        run: |
          unzip -q easy_store_flutter_source.zip -d flutter_source

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find flutter_source -name pubspec.yaml -print -quit)")
          echo "Flutter project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find flutter_source -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/easy-store-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Store-APK
          path: easy-store-release.apk
